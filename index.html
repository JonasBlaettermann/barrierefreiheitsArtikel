<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barrierefreiheit erleben</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="challenge">

    <header class="challenge-header">
        <h2 id="title"></h2>

        <div id="challengeNavigation" class="challenge-navigation"></div>
    </header>

    <section class="challenge-section">
        <div id="introduction"></div>
    </section>

    <section class="challenge-section">

        <div class="challenge-demo">
            <div class="demo-content" id="demo"></div>
        </div>

        <div id="comparisonPanel" class="comparison-panel hidden">

            <h3>Varianten vergleichen</h3>

            <p class="comparison-description">
                Wechseln Sie zwischen den verschiedenen Varianten und beobachten Sie,
                wie sich die Bedienbarkeit verändert.
            </p>

            <div class="comparison-options">

                <div class="toggle-container">

                    <span id="simulation-left" class="toggle-label active">
                        Normativ
                    </span>

                    <label class="switch">
                        <input type="checkbox" id="toggleView">
                        <span class="slider"></span>
                    </label>

                    <span id="simulation-right" class="toggle-label">
                        Eingeschränkt
                    </span>

                </div>

                <div class="toggle-container">

                    <span id="accessibility-left" class="toggle-label active">
                        Nicht barrierefrei
                    </span>

                    <label class="switch">
                        <input id="accessibility-switch" type="checkbox">
                        <span class="slider"></span>
                    </label>

                    <span id="accessibility-right" class="toggle-label">
                        Barrierefrei
                    </span>

                </div>

            </div>

        </div>

    </section>

    <section class="challenge-section challenge-result" id="result">

        <div id="resultText"></div>

    </section>

    <section class="challenge-section">

    <button id="checkButton" disabled>
        Bitte führen Sie zuerst die Aufgabe aus
    </button>

</section>
    

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
